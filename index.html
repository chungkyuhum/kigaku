.cell .e{font-size:12px;text-align:right;line-height:1}
.cell.me{border:2px solid var(--accent);background:var(--accent-bg)}
.cell.me::after{content:"あなた";position:absolute;top:5px;right:7px;font-size:11px;color:var(--accent)}
.cell.bad{border-style:dashed}
[data-e="水"]{color:var(--water)}[data-e="木"]{color:var(--wood)}[data-e="火"]{color:var(--fire)}[data-e="土"]{color:var(--earth)}[data-e="金"]{color:var(--metal)}
.cap{text-align:center;font-size:13px;color:var(--sub);margin:0 0 26px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}

fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px 14px;margin:0 0 14px}
legend{font-weight:500;padding:0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:14px;color:var(--sub);flex:1;min-width:140px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-top:4px;min-height:44px}
.go{width:100%;min-height:48px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;font:500 17px "Noto Sans JP",sans-serif;cursor:pointer}
.res{margin-top:26px}
.res h2{font-size:24px;margin:0 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0}
.stars{color:var(--accent);letter-spacing:.1em}
.score{font-family:"Zen Old Mincho",serif;font-size:44px;font-weight:700;line-height:1}
.err{color:var(--fire)}
.note{font-size:13px;color:var(--sub);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.dir{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin:2px 4px 2px 0;font-size:14px}

<script src="xlsx.mini.min.js"></script>
<script>
const GRID=["巽","離","坤","震","中","兌","艮","坎","乾"];
const ORDER=["中","乾","兌","艮","離","坎","坤","震","巽"];
const DIR={巽:"南東",離:"南",坤:"南西",震:"東",中:"中央",兌:"西",艮:"北東",坎:"北",乾:"北西"};
const OPP={坎:"離",離:"坎",坤:"艮",艮:"坤",震:"兌",兌:"震",巽:"乾",乾:"巽"};
const GEN={水:"木",木:"火",火:"土",土:"金",金:"水"};
const CTL={木:"土",土:"水",水:"火",火:"金",金:"木"};
// 節入りの近似式の係数 [月, 20世紀, 21世紀]（小寒〜大雪）
const CT=[[1,6.11,5.4055],[2,4.6295,3.87],[3,6.3826,5.63],[4,5.59,4.81],[5,6.318,5.52],[6,6.5,5.678],[7,7.928,7.108],[8,8.35,7.5],[9,8.44,7.646],[10,9.098,8.318],[11,8.218,7.438],[12,7.9,7.18]];
const $=id=>document.getElementById(id);
const sum=n=>{n=String(n).split("").reduce((a,c)=>a+ +c,0);return n>9?sum(n):n};
const wrap=n=>{while(n>9)n-=9;while(n<1)n+=9;return n};
let C,BY,TI;
function termDay(y,m){
  const o=((C.yearly.setsuiriOverride||{})[y]||{})[m];if(o)return o;
  const a=CT[m-1],Y=y<=2000?y-1900:y-2000;
  return Math.floor(Y*.2422+(y<=2000?a[1]:a[2]))-Math.floor((m<=2?Y-1:Y)/4);
}
// 節入りを基準にした年（立春前は前年）と月番号（0=2月節）
function info(y,m,d){
  let t=m,by=y;
  if(d<termDay(y,m))t=m-1||12;
  if(m<2||(m===2&&d<termDay(y,2)))by=y-1;
  return{by,i:(t-2+12)%12};
}
const center=y=>wrap(11-sum(y));
const monthStar=(by,i)=>{const c=center(by);return wrap((c%3===1?8:c%3===2?2:5)-i)};
function place(c){const o={};ORDER.forEach((p,k)=>o[p]=wrap(c+k));return o}
const find=(pl,s)=>Object.keys(pl).find(p=>pl[p]===s);
const ST=n=>C.fixed.stars[n-1];
function board(pl,me,bad){
  return '<div class="board">'+GRID.map(p=>{const s=pl[p],st=ST(s);
    return `<div class="cell${me===s?" me":""}${bad&&bad.includes(p)?" bad":""}"><span class="p">${p}・${DIR[p]}</span><span class="s" data-e="${st.el}">${st.name.slice(0,2)}</span><span class="e" data-e="${st.el}">${st.el}</span></div>`}).join("")+"</div>";
}
function fortune(){
  const v=$("d1").value,out=$("r1");
  if(!C)return;
  if(!v){out.innerHTML='<p class="err">生年月日を入力してください。</p>';return}
  const [y,m,d]=v.split("-").map(Number),g=$("g1").value,{by,i}=info(y,m,d),s=sum(by);
  const n=wrap(g==="m"?11-s:s+4),mn=monthStar(by,i),st=ST(n),ms=ST(mn);
  const pl=place(center(BY)),pos=find(pl,n),f=C.yearly.palaceYear[pos];
  const five=find(pl,5),anken=five==="中"?null:OPP[five],honSat=pos==="中"?null:pos,honTeki=pos==="中"?null:OPP[pos];
  const bad=[five,anken,honSat,honTeki].filter(x=>x&&x!=="中");
  const good=Object.keys(pl).filter(p=>p!=="中"&&!bad.includes(p)&&pl[p]!==5&&(ST(pl[p]).el===st.el||GEN[ST(pl[p]).el]===st.el));
  const mpl=place(monthStar(BY,TI)),mpos=find(mpl,n),mf=C.yearly.palaceMonth[mpos],mm=((TI+1)%12)+1;
  $("hero").innerHTML=board(pl,n,bad)+`<p class="cap">${BY}年の年盤（点線は凶方位）</p>`;
  out.innerHTML=`<h2>本命星：<span data-e="${st.el}">${st.name}</span></h2><p>${st.text}</p>
  <div class="card"><h3>月命星：<span data-e="${ms.el}">${ms.name}</span></h3><p>本命星が社会での顔、月命星は内面の性質とされます。内面では次の傾向があります。${ms.text}</p></div>
  <div class="card"><h3>${BY}年の運勢：${pos}に入る「${f.t}」 <span class="stars" aria-label="${f.r}／5">${"★".repeat(f.r)}${"☆".repeat(5-f.r)}</span></h3><p>${f.s}</p></div>
  <div class="card"><h3>${mm}月（節入り以降）の運勢：${mpos}に入る「${mf.t}」</h3><p>${mf.s}</p></div>
  <div class="card"><h3>今年の吉方位</h3><p>${good.length?good.map(p=>`<span class="dir">${DIR[p]}</span>`).join(""):"今年は目立った吉方位がありません。"}</p>
  <p style="font-size:14px;color:var(--sub);margin-top:6px">あなたの星を生む、または同じ五行の星が入る方位です。</p></div>
  <div class="card"><h3>避けたい方位</h3><p>${[...new Set(bad)].map(p=>`<span class="dir">${DIR[p]}</span>`).join("")||"なし"}</p>
  <p style="font-size:14px;color:var(--sub);margin-top:6px">五黄殺${anken?"・暗剣殺":""}${honSat?"・本命殺・本命的殺":""}にあたる方位です。</p></div>`;
}
function honmei(v,g){const [y,m,d]=v.split("-").map(Number),s=sum(info(y,m,d).by);return wrap(g==="m"?11-s:s+4)}
function compat(){
  const a=$("d2").value,b=$("d3").value,out=$("r2");
  if(!C)return;
  if(!a||!b){out.innerHTML='<p class="err">二人の生年月日を入力してください。</p>';return}
  const x=honmei(a,$("g2").value),y=honmei(b,$("g3").value),ex=ST(x).el,ey=ST(y).el;
  const k=ex===ey?"same":GEN[ex]===ey?"give":GEN[ey]===ex?"recv":CTL[ex]===ey?"win":"lose",r=C.fixed.relations[k];
  out.innerHTML=`<h2><span data-e="${ex}">${ST(x).name}</span> と <span data-e="${ey}">${ST(y).name}</span></h2>
  <div class="card"><div class="score">${r.score}<span style="font-size:18px"> 点</span></div><h3 style="margin-top:8px">${r.label}</h3><p>${r.text}</p></div>
  ${(x===5||y===5)?'<div class="card"><h3>五黄土星を含む組み合わせ</h3><p>五黄土星は個性が強く、相手に大きな影響を与えます。五行の関係だけでなく、お互いの主張を尊重する姿勢が大切です。</p></div>':""}
  <div class="card"><h3>あなた（${ST(x).name}）</h3><p>${ST(x).text}</p></div>
  <div class="card"><h3>お相手（${ST(y).name}）</h3><p>${ST(y).text}</p></div>
  <p style="font-size:14px;color:var(--sub)">五行の相生・相剋にもとづく簡易判定です。点数は目安にとどめてください。</p>`;
}
$("b1").onclick=fortune;$("b2").onclick=compat;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(t=>{const on=t===b;t.setAttribute("aria-selected",on);$(t.getAttribute("aria-controls")).hidden=!on});
});
function parse(wb){
  const errs=[],t=v=>String(v??"").trim(),PAL="中乾兌艮離坎坤震巽".split("");
  const g=n=>{const w=wb.Sheets[n];if(!w){errs.push(`「${n}」シートが見つかりません`);return[]}return XLSX.utils.sheet_to_json(w,{header:1,defval:""}).slice(1).map(r=>r.map(t))};
  const E=(s,i,m)=>errs.push(`「${s}」シートの${i+2}行目：${m}`),blank=r=>r.every(x=>x==="");
  const yr=g("設定").find(r=>r[0]==="対象年"),year=yr?+yr[1]:NaN;
  if(!(year>=1901&&year<=2099))errs.push("「設定」シートの「対象年」に西暦の数字を入れてください");
  const stars=[],sr=g("九星");
  for(let k=0;k<9;k++){const r=sr[k]||[];
    if(!r[1])E("九星",k,"星の名前が空です");
    if(!"水木火土金".includes(r[2]||"x")||r[2].length!==1)E("九星",k,"五行は 水・木・火・土・金 のどれか1文字にしてください");
    if(!r[3])E("九星",k,"性格説明が空です");
    stars.push({name:r[1],el:r[2],text:r[3]})}
  const py={},pm={};
  g("年運").forEach((r,i)=>{if(blank(r))return;const p=r[0];if(!PAL.includes(p)){E("年運",i,"方位は 中・乾・兌・艮・離・坎・坤・震・巽 のどれかです");return}
    const n=+r[2];if(!(n>=1&&n<=5&&Number.isInteger(n)))E("年運",i,"★の数は1〜5の整数にしてください");
    if(!r[1]||!r[3])E("年運",i,"タイトルまたは説明が空です");py[p]={t:r[1],r:n,s:r[3]}});
  g("月運").forEach((r,i)=>{if(blank(r))return;const p=r[0];if(!PAL.includes(p)){E("月運",i,"方位は 中・乾・兌・艮・離・坎・坤・震・巽 のどれかです");return}
    if(!r[1]||!r[2])E("月運",i,"タイトルまたは説明が空です");pm[p]={t:r[1],s:r[2]}});
  PAL.forEach(p=>{if(!py[p])errs.push(`「年運」シートに「${p}」の行がありません`);if(!pm[p])errs.push(`「月運」シートに「${p}」の行がありません`)});
  const rel={},rr=g("相性");
  ["same","give","recv","win","lose"].forEach((k,i)=>{const r=rr[i]||[];const sc=+r[1];
    if(!(sc>=0&&sc<=100&&r[1]!==""))E("相性",i,"点数は0〜100の数字にしてください");
    if(!r[2]||!r[3])E("相性",i,"見出しまたは説明が空です");rel[k]={score:sc,label:r[2],text:r[3]}});
  const ov={};
  g("節入り補正").forEach((r,i)=>{if(blank(r.slice(0,3)))return;const[y,m,d]=r.slice(0,3).map(Number);
    if(!(y>=1901&&y<=2099&&m>=1&&m<=12&&d>=1&&d<=10&&[y,m,d].every(Number.isInteger)))E("節入り補正",i,"年・月・日を正しい数字で入れてください（日は節入りの日で1〜10）");
    else(ov[y]=ov[y]||{})[m]=d});
  if(errs.length)throw errs;
  return{fixed:{stars,relations:rel},yearly:{year,setsuiriOverride:ov,palaceYear:py,palaceMonth:pm}};
}

.then(b=>{C=parse(XLSX.read(b,{type:"array"}));
  const t=new Date(),o=info(t.getFullYear(),t.getMonth()+1,t.getDate());BY=o.by;TI=o.i;
  if(C.yearly.year!==BY)console.warn("content.xlsx は "+C.yearly.year+" 年版です。"+BY+" 年用に更新してください。");
  $("hero").innerHTML=board(place(center(BY)),0)+`<p class="cap">${BY}年の年盤（各方位に入る九星）</p>`;
}).catch(e=>{$("hero").innerHTML='<div class="card"><h3 class="err">データを読み込めません</h3>'+(Array.isArray(e)?e:["content.xlsx を読み込めませんでした。Webサーバー経由で開いているか確認してください"]).map(x=>`<p class="err">${x}</p>`).join("")+"</div>"});
