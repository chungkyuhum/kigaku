<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九星気学 運勢・相性診断</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f6;--surface:#fbfcfe;--ink:#1c2740;--sub:#5b6577;--line:#cfd6e2;--accent:#a3762a;--accent-bg:#f3e8d0;--good-bg:#dcefd9;--bad-bg:#f8dad5;
  --water:#2f5d8a;--wood:#3c7a4e;--fire:#b5473a;--earth:#8f6d22;--metal:#6b7685;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111826;--surface:#182134;--ink:#e6eaf3;--sub:#9aa5ba;--line:#2e3a52;--accent:#d9ae5c;--accent-bg:#3a3020;--good-bg:#24402e;--bad-bg:#4a2a26;
  --water:#6fa3d6;--wood:#76b88a;--fire:#e07f70;--earth:#cfa650;--metal:#a3adbb;}}
:root[data-theme="dark"]{
  --bg:#111826;--surface:#182134;--ink:#e6eaf3;--sub:#9aa5ba;--line:#2e3a52;--accent:#d9ae5c;--accent-bg:#3a3020;--good-bg:#24402e;--bad-bg:#4a2a26;
  --water:#6fa3d6;--wood:#76b88a;--fire:#e07f70;--earth:#cfa650;--metal:#a3adbb;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
h1,h2,.serif{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700}
h1{font-size:clamp(28px,7vw,40px);margin:0 0 6px;letter-spacing:.06em;line-height:1.3}
.lead{color:var(--sub);margin:0 0 22px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin:0 auto 8px}
.cell{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.cell .p{font-size:12px;color:var(--sub);line-height:1.3}
.cell .s{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:clamp(20px,6vw,28px);line-height:1.1;text-align:center}
.cell .e{font-size:12px;text-align:right;line-height:1}
.cell.me{border:2px solid var(--accent);background:var(--accent-bg)}
.cell.me::after{content:"あなた";position:absolute;top:5px;right:7px;font-size:11px;color:var(--accent)}
.cell.bad{border-style:dashed}
[data-e="水"]{color:var(--water)}[data-e="木"]{color:var(--wood)}[data-e="火"]{color:var(--fire)}[data-e="土"]{color:var(--earth)}[data-e="金"]{color:var(--metal)}
.cap{text-align:center;font-size:13px;color:var(--sub);margin:0 0 26px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font:500 16px "Noto Sans JP",sans-serif;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px 14px;margin:0 0 14px}
legend{font-weight:500;padding:0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:14px;color:var(--sub);flex:1;min-width:140px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-top:4px;min-height:44px}
.go{width:100%;min-height:48px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;font:500 17px "Noto Sans JP",sans-serif;cursor:pointer}
.res{margin-top:26px}
.res h2{font-size:24px;margin:0 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0}
.stars{color:var(--accent);letter-spacing:.1em}
.score{font-family:"Zen Old Mincho",serif;font-size:44px;font-weight:700;line-height:1}
.err{color:var(--fire)}
.note{font-size:13px;color:var(--sub);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.dir{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin:2px 4px 2px 0;font-size:14px}
/* .sns{text-align:center;margin:30px 0 0}
.sns a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.sns a:hover{border-color:var(--accent)} */
/* .contact{margin-top:36px;border-top:1px solid var(--line);padding-top:24px}
.contact h2{font-size:22px;margin:0 0 6px}
.contact p{margin:0 0 14px;color:var(--sub);font-size:14px}
.contact iframe{display:block;width:100%;height:900px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.contact .alt{margin:10px 0 0;text-align:center}
.contact .alt a{color:var(--ink)} */
.contact{margin-top:36px;border-top:1px solid var(--line);padding-top:24px;text-align:center}
.contact h2{font-size:22px;margin:0 0 6px}
.contact p{margin:0 0 14px;color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:8px;font-weight:500}
.btn:hover{opacity:.9}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.copy{font:inherit;font-size:13px;min-height:36px;padding:0 12px;margin:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.addr a{color:var(--ink)}
.yr{list-style:none;margin:0;padding:0}.yr li{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}.yr li.now{background:var(--accent-bg);font-weight:500}.yr .mo{width:3em}.yr .pl{width:2em;color:var(--sub)}
.priv{font-size:13px;color:var(--sub);margin:0 0 12px}
.card.notice{border-left:4px solid var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0}
.cal .wk{text-align:center;font-size:13px;color:var(--sub)}
.cal .day{min-height:52px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.cal .day .n{font-size:15px}.cal .day .s{font-size:14px;min-height:1.25em}
.cal .day.good{background:var(--good-bg)}.cal .day.bad{background:var(--bad-bg)}.cal .day.tensha{background:var(--accent-bg);border-color:var(--accent)}
.cal .day.today{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700}
.actnote{margin:6px 0;font-size:14px}.actnote .mk{display:inline-block;width:1.8em;text-align:center}
.small{font-size:13px;color:var(--sub);margin:8px 0 0}.card h4{margin:16px 0 4px;font-size:15px}
.dl{list-style:none;margin:0;padding:0}.dl li{padding:8px 0;border-bottom:1px solid var(--line)}.dl li:last-child{border-bottom:0}
.dall{list-style:none;margin:6px 0 0;padding:0}.dall li{display:flex;gap:6px 14px;flex-wrap:wrap;padding:8px 4px;border-bottom:1px solid var(--line)}.dall .mo{width:3em;font-weight:500}.dall .g{color:var(--wood);font-weight:500}.dall .b{color:var(--fire);font-weight:500}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1 data-t="h1"></h1>
<p class="lead" data-t="lead"></p>

<div id="hero"></div>

<div class="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true" aria-controls="p1" data-t="tab1"></button>
  <button role="tab" id="t2" aria-selected="false" aria-controls="p2" data-t="tab2"></button>
  <button role="tab" id="t3" aria-selected="false" aria-controls="p3" data-t="tab3"></button>
</div>

<section id="p1" role="tabpanel" aria-labelledby="t1">
  <fieldset><legend data-t="legend_you"></legend>
    <div class="row">
      <label><span data-t="lbl_name"></span><input type="text" id="n1" maxlength="20" autocomplete="off"></label>
      <label><span data-t="lbl_birth"></span><input type="date" id="d1" min="1901-01-01" max="2099-12-31"></label>
    </div>
  </fieldset>
  <p class="priv" data-t="privacy"></p>
  <button class="go" id="b1" data-t="btn_fortune"></button>
  <div class="res" id="r1" aria-live="polite"></div>
</section>

<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
  <fieldset><legend data-t="legend_you"></legend>
    <div class="row">
      <label><span data-t="lbl_name"></span><input type="text" id="n2" maxlength="20" autocomplete="off"></label>
      <label><span data-t="lbl_birth"></span><input type="date" id="d2" min="1901-01-01" max="2099-12-31"></label>
    </div>
  </fieldset>
  <fieldset><legend data-t="legend_partner"></legend>
    <div class="row">
      <label><span data-t="lbl_name"></span><input type="text" id="n3" maxlength="20" autocomplete="off"></label>
      <label><span data-t="lbl_birth"></span><input type="date" id="d3" min="1901-01-01" max="2099-12-31"></label>
    </div>
  </fieldset>
  <p class="priv" data-t="privacy"></p>
  <button class="go" id="b2" data-t="btn_compat"></button>
  <div class="res" id="r2" aria-live="polite"></div>
</section>

<section id="p3" role="tabpanel" aria-labelledby="t3" hidden>
  <div class="row">
    <label><span data-t="lbl_year"></span><select id="ay"></select></label>
    <label><span data-t="lbl_month"></span><select id="am"></select></label>
  </div>
  <div id="r3" aria-live="polite"></div>
</section>

<section class="contact" id="contact">
  <h2 data-t="contact_h"></h2>
  <p data-t="contact_text"></p>
  <p class="btn-wrap"><a class="btn" id="mail" href="#" data-t="contact_btn"></a></p>
</section>
<p class="note" data-t="disclaimer"></p>
</main>

<script src="xlsx.mini.min.js"></script>
<script>
const GRID=["巽","離","坤","震","中","兌","艮","坎","乾"];
const ORDER=["中","乾","兌","艮","離","坎","坤","震","巽"];
const DIR={巽:"南東",離:"南",坤:"南西",震:"東",中:"中央",兌:"西",艮:"北東",坎:"北",乾:"北西"};
const OPP={坎:"離",離:"坎",坤:"艮",艮:"坤",震:"兌",兌:"震",巽:"乾",乾:"巽"};
const GEN={水:"木",木:"火",火:"土",土:"金",金:"水"};
const CTL={木:"土",土:"水",水:"火",火:"金",金:"木"};
// 節入りの近似式の係数 [月, 20世紀, 21世紀]（小寒〜大雪）
const CT=[[1,6.11,5.4055],[2,4.6295,3.87],[3,6.3826,5.63],[4,5.59,4.81],[5,6.318,5.52],[6,6.5,5.678],[7,7.928,7.108],[8,8.35,7.5],[9,8.44,7.646],[10,9.098,8.318],[11,8.218,7.438],[12,7.9,7.18]];
const $=id=>document.getElementById(id);
const sum=n=>{n=String(n).split("").reduce((a,c)=>a+ +c,0);return n>9?sum(n):n};
const wrap=n=>{while(n>9)n-=9;while(n<1)n+=9;return n};
let C,BY,TI,T={},ACT={data:{},errors:[]},DIRS={good:[],bad:{},errors:[]};const KEYS=["title", "h1", "lead", "tab1", "tab2", "legend_you", "legend_partner", "lbl_name", "lbl_birth", "privacy", "btn_fortune", "btn_compat", "disclaimer", "contact_h", "contact_text", "contact_btn", "contact_mail", "contact_subject", "contact_body", "cap_board", "h_body", "lbl_body", "lbl_care", "body_note", "h_dir", "lbl_dirmonth", "dir_board_cap", "h_dir_good", "dir_good_item", "dir_good_none", "h_dir_bad", "dir_bad_item", "dir_bad_none", "h_dir_all", "dir_lbl_good", "dir_lbl_bad", "dir_all_note", "tab3", "lbl_year", "lbl_month", "act_nodata", "act_today_good", "act_today_bad", "act_today_tensha", "act_today_none", "act_good_title", "act_good_note", "act_bad_title", "act_bad_note", "act_tensha_title", "act_tensha_note", "act_none_note", "who_input", "notice_setsu", "notice_risshun", "cap_board_me", "err_birth", "res_title", "res_title_named", "lbl_honmei", "lbl_getsumei", "getsumei_note", "h_year", "h_cat", "h_good", "good_none", "good_note", "h_bad", "bad_none", "bad_note", "h_months", "months_note", "err_birth2", "and", "pt", "gokou_h", "gokou_text", "h_you", "h_partner", "res_compat_named", "h_you_named", "h_partner_named", "compat_note"];
function termDay(y,m){
  const o=((C.yearly.setsuiriOverride||{})[y]||{})[m];if(o)return o;
  const tb=((C.yearly.setsuiriTable||{})[y]||{})[m];if(tb)return tb.d;
  const a=CT[m-1],Y=y<=2000?y-1900:y-2000;
  return Math.floor(Y*.2422+(y<=2000?a[1]:a[2]))-Math.floor((m<=2?Y-1:Y)/4);
}
const SETSU=["小寒","立春","啓蟄","清明","立夏","芒種","小暑","立秋","白露","寒露","立冬","大雪"];
// 節入りの時刻（表示用）。表に時刻があり、補正で日が変わっていないときだけ返す
function termTime(y,m){
  const tb=((C.yearly.setsuiriTable||{})[y]||{})[m],ov=((C.yearly.setsuiriOverride||{})[y]||{})[m];
  return tb&&tb.h!=null&&(!ov||ov===tb.d)?tb:null;
}
// 節入りを基準にした年（立春前は前年）と月番号（0=2月節）
function info(y,m,d){
  let t=m,by=y;
  if(d<termDay(y,m))t=m-1||12;
  if(m<2||(m===2&&d<termDay(y,2)))by=y-1;
  return{by,i:(t-2+12)%12};
}
const center=y=>wrap(11-sum(y));
const monthStar=(by,i)=>{const c=center(by);return wrap((c%3===1?8:c%3===2?2:5)-i)};
// 星の計算：合計数 → 年の星 → 本命星・月命星
function calcStars(y,m,d){
  const {by,i}=info(y,m,d);                       // by=節入りを基準にした年、i=月の番号
  const total=sum(by);                            // 合計数
  const yearStar=center(by);                      // 年の星（男女共通）
  const honmei=yearStar;                        // 本命星（年の星と同じ。男女共通）
  const getsumei=monthStar(by,i);                 // 月命星（年の星と月で決まる。男女共通）
  return {by,i,total,yearStar,honmei,getsumei};
}
function place(c){const o={};ORDER.forEach((p,k)=>o[p]=wrap(c+k));return o}
const find=(pl,s)=>Object.keys(pl).find(p=>pl[p]===s);
const ST=n=>C.fixed.stars[n-1];
function board(pl,me,bad){
  return '<div class="board">'+GRID.map(p=>{const s=pl[p],st=ST(s);
    return `<div class="cell${me===s?" me":""}${bad&&bad.includes(p)?" bad":""}"><span class="p">${p}・${DIR[p]}</span><span class="s" data-e="${st.el}">${st.name.slice(0,2)}</span><span class="e" data-e="${st.el}">${st.el}</span></div>`}).join("")+"</div>";
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=(k,o)=>String(T[k]??"").replace(/\{(\w+)\}/g,(m,x)=>o&&x in o?o[x]:m);
const tx=(k,o)=>esc(t(k,o));
// 節入りの日に生まれた方への注意（時刻を見ていないため）
function setsuiNote(y,m,d,who){
  if(d!==termDay(y,m))return "";
  const tm=termTime(y,m),when=`${m}月${d}日`+(tm?` ${tm.h}時${tm.mi}分`:"");
  return `<div class="card notice"><p>${tx(m===2?"notice_risshun":"notice_setsu",{who,year:y,setsu:SETSU[m-1],when})}</p></div>`;
}
function fortune(){
  const v=$("d1").value,out=$("r1");
  if(!C)return;
  if(!v){out.innerHTML=`<p class="err">${tx("err_birth")}</p>`;return}
  const nm=$("n1").value.trim().slice(0,20);
  const [y,m,d]=v.split("-").map(Number);
  const {honmei:honmeiStar,getsumei:getsumeiStar}=calcStars(y,m,d),honmeiInfo=ST(honmeiStar),getsumeiInfo=ST(getsumeiStar);
  const pl=place(center(BY)),pos=find(pl,honmeiStar),f=C.yearly.palaceYear[pos];
  const five=find(pl,5),anken=five==="中"?null:OPP[five],honSat=pos==="中"?null:pos,honTeki=pos==="中"?null:OPP[pos];
  const bad=[five,anken,honSat,honTeki].filter(x=>x&&x!=="中");
  const good=Object.keys(pl).filter(p=>p!=="中"&&!bad.includes(p)&&pl[p]!==5&&(ST(pl[p]).el===honmeiInfo.el||GEN[ST(pl[p]).el]===honmeiInfo.el));
  const names=["五黄殺"];if(anken)names.push("暗剣殺");if(honSat)names.push("本命殺","本命的殺");
  const cats=C.categories.map(c=>`<div class="card"><h3>${tx("h_cat",{name:c.name,year:BY})}</h3><p>${esc(c.text[pos])}</p></div>`).join("");
  const yr=Array.from({length:12},(_,k)=>{const mp=find(place(monthStar(BY,k)),honmeiStar);return `<li${k===TI?' class="now"':""}><span class="mo">${((k+1)%12)+1}月</span><span class="pl">${mp}</span><span>${C.yearly.palaceMonth[mp].t}</span></li>`}).join("");
  const bodyCard=(honmeiInfo.body||honmeiInfo.care)?`<div class="card"><h3>${tx("h_body")}</h3>${honmeiInfo.body?`<p><b>${tx("lbl_body")}</b>${esc(honmeiInfo.body)}</p>`:""}${honmeiInfo.care?`<p><b>${tx("lbl_care")}</b>${esc(honmeiInfo.care)}</p>`:""}<p class="small">${tx("body_note")}</p></div>`:"";
  $("hero").innerHTML=board(pl,honmeiStar,bad)+`<p class="cap">${tx("cap_board_me",{year:BY})}</p>`;
  out.innerHTML=`<h2>${nm?tx("res_title_named",{name:nm}):tx("res_title")}</h2>
  ${setsuiNote(y,m,d,t("who_input"))}
  <div class="card"><h3>${tx("lbl_honmei")}<span data-e="${honmeiInfo.el}">${honmeiInfo.name}</span></h3><p>${honmeiInfo.text}</p></div>
  ${bodyCard}
  <div class="card"><h3>${tx("lbl_getsumei")}<span data-e="${getsumeiInfo.el}">${getsumeiInfo.name}</span></h3><p>${tx("getsumei_note")}${getsumeiInfo.text}</p></div>
  <div class="card"><h3>${tx("h_year",{year:BY,palace:pos,title:f.t})} <span class="stars" aria-label="${f.r}／5">${"★".repeat(f.r)}${"☆".repeat(5-f.r)}</span></h3><p>${f.s}</p></div>
  ${cats}
  <div class="card"><h3>${tx("h_good")}</h3><p>${good.length?good.map(p=>`<span class="dir">${DIR[p]}</span>`).join(""):tx("good_none")}</p>
  <p style="font-size:14px;color:var(--sub);margin-top:6px">${tx("good_note")}</p></div>
  <div class="card"><h3>${tx("h_bad")}</h3><p>${[...new Set(bad)].map(p=>`<span class="dir">${DIR[p]}</span>`).join("")||tx("bad_none")}</p>
  <p style="font-size:14px;color:var(--sub);margin-top:6px">${tx("bad_note",{names:names.join("・")})}</p></div>
  <div class="card"><h3>${tx("h_months",{year:BY})}</h3><ul class="yr">${yr}</ul>
  <p style="font-size:13px;color:var(--sub);margin-top:6px">${tx("months_note")}</p></div>
  <div class="card"><h3>${tx("h_dir")}</h3><label><span>${tx("lbl_dirmonth")}</span><select id="dm"></select></label><div id="dirbox"></div></div>`;
  initDirs(honmeiStar);
}
function honmeiOf(v){const [y,m,d]=v.split("-").map(Number);return calcStars(y,m,d).honmei}
function compat(){
  const a=$("d2").value,b=$("d3").value,out=$("r2");
  if(!C)return;
  if(!a||!b){out.innerHTML=`<p class="err">${tx("err_birth2")}</p>`;return}
  const youName=$("n2").value.trim().slice(0,20),partnerName=$("n3").value.trim().slice(0,20);
  const youStar=honmeiOf(a),partnerStar=honmeiOf(b),ex=ST(youStar).el,ey=ST(partnerStar).el;

function parse(wb){

    const n=+r[2];if(!(n>=1&&n<=5&&Number.isInteger(n)))E("年運",i,"★の数は1〜5の整数にしてください");
    if(!r[1]||!r[3])E("年運",i,"タイトルまたは説明が空です");py[p]={t:r[1],r:n,s:r[3]}});
  g("月運").forEach((r,i)=>{if(blank(r))return;const p=r[0];if(!PAL.includes(p)){E("月運",i,"方位は 中・乾・兌・艮・離・坎・坤・震・巽 のどれかです");return}
    if(!r[1]||!r[2])E("月運",i,"タイトルまたは説明が空です");pm[p]={t:r[1],s:r[2]}});
  PAL.forEach(p=>{if(!py[p])errs.push(`「年運」シートに「${p}」の行がありません`);if(!pm[p])errs.push(`「月運」シートに「${p}」の行がありません`)});

    if(!(sc>=0&&sc<=100&&r[1]!==""))E("相性",i,"点数は0〜100の数字にしてください");

    KEYS.forEach(k=>{if(!(k in T2))errs.push(`「画面文言」シートに「${k}」の行がありません（A列に ${k} と書いた行が必要です）`)})}
