<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九星気学 運勢・相性診断</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f6;--surface:#fbfcfe;--ink:#1c2740;--sub:#5b6577;--line:#cfd6e2;--accent:#a3762a;--accent-bg:#f3e8d0;
  --water:#2f5d8a;--wood:#3c7a4e;--fire:#b5473a;--earth:#8f6d22;--metal:#6b7685;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111826;--surface:#182134;--ink:#e6eaf3;--sub:#9aa5ba;--line:#2e3a52;--accent:#d9ae5c;--accent-bg:#3a3020;
  --water:#6fa3d6;--wood:#76b88a;--fire:#e07f70;--earth:#cfa650;--metal:#a3adbb;}}
:root[data-theme="dark"]{
  --bg:#111826;--surface:#182134;--ink:#e6eaf3;--sub:#9aa5ba;--line:#2e3a52;--accent:#d9ae5c;--accent-bg:#3a3020;
  --water:#6fa3d6;--wood:#76b88a;--fire:#e07f70;--earth:#cfa650;--metal:#a3adbb;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
h1,h2,.serif{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700}
h1{font-size:clamp(28px,7vw,40px);margin:0 0 6px;letter-spacing:.06em;line-height:1.3}
.lead{color:var(--sub);margin:0 0 22px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin:0 auto 8px}
.cell{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.cell .p{font-size:12px;color:var(--sub);line-height:1.3}
.cell .s{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:clamp(20px,6vw,28px);line-height:1.1;text-align:center}
.cell .e{font-size:12px;text-align:right;line-height:1}
.cell.me{border:2px solid var(--accent);background:var(--accent-bg)}
.cell.me::after{content:"あなた";position:absolute;top:5px;right:7px;font-size:11px;color:var(--accent)}
.cell.bad{border-style:dashed}
[data-e="水"]{color:var(--water)}[data-e="木"]{color:var(--wood)}[data-e="火"]{color:var(--fire)}[data-e="土"]{color:var(--earth)}[data-e="金"]{color:var(--metal)}
.cap{text-align:center;font-size:13px;color:var(--sub);margin:0 0 26px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font:500 16px "Noto Sans JP",sans-serif;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px 14px;margin:0 0 14px}
legend{font-weight:500;padding:0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:14px;color:var(--sub);flex:1;min-width:140px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-top:4px;min-height:44px}
.go{width:100%;min-height:48px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;font:500 17px "Noto Sans JP",sans-serif;cursor:pointer}
.res{margin-top:26px}
.res h2{font-size:24px;margin:0 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0}
.stars{color:var(--accent);letter-spacing:.1em}
.score{font-family:"Zen Old Mincho",serif;font-size:44px;font-weight:700;line-height:1}
.err{color:var(--fire)}
.note{font-size:13px;color:var(--sub);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.dir{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin:2px 4px 2px 0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>九星気学 運勢・相性診断</h1>
<p class="lead">生年月日から本命星を割り出し、今年の運勢と吉方位、二人の相性を調べます。</p>

<div id="hero"></div>

<div class="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true" aria-controls="p1">運勢</button>
  <button role="tab" id="t2" aria-selected="false" aria-controls="p2">相性</button>
</div>

<section id="p1" role="tabpanel" aria-labelledby="t1">
  <fieldset><legend>あなた</legend>
    <div class="row">
      <label>生年月日<input type="date" id="d1" min="1900-01-01" max="2100-12-31"></label>
      <label>性別<select id="g1"><option value="m">男性</option><option value="f">女性</option></select></label>
    </div>
  </fieldset>
  <button class="go" id="b1">運勢を見る</button>
  <div class="res" id="r1" aria-live="polite"></div>
</section>

<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
  <fieldset><legend>あなた</legend>
    <div class="row">
      <label>生年月日<input type="date" id="d2" min="1900-01-01" max="2100-12-31"></label>
      <label>性別<select id="g2"><option value="m">男性</option><option value="f">女性</option></select></label>
    </div>
  </fieldset>
  <fieldset><legend>お相手</legend>
    <div class="row">
      <label>生年月日<input type="date" id="d3" min="1900-01-01" max="2100-12-31"></label>
      <label>性別<select id="g3"><option value="f">女性</option><option value="m">男性</option></select></label>
    </div>
  </fieldset>
  <button class="go" id="b2">相性を見る</button>
  <div class="res" id="r2" aria-live="polite"></div>
</section>

<p class="note">節分（立春）を2月4日として簡易計算しています。2月3日・4日生まれの方は、実際の立春の日時で本命星が変わる場合があります。結果は伝統的な解釈にもとづく読み物で、娯楽としてお楽しみください。</p>
</main>

<script>
const S=[null,["一白水星","水","柔軟で粘り強く、人に寄り添いながら道を見つけます。内に秘めた思いを抱えやすい面があります。"],
["二黒土星","土","堅実で面倒見がよく、縁の下を支える努力家です。心配しすぎる傾向があります。"],
["三碧木星","木","発想と行動力の人で、思い立ったらすぐ動きます。熱しやすく冷めやすい面があります。"],
["四緑木星","木","誠実で調和を大切にし、信用を積み上げます。迷いやすく決断が遅れることがあります。"],
["五黄土星","土","強いリーダー気質で、実行力と存在感があります。頑固になりやすい面があります。"],
["六白金星","金","責任感と向上心が強く、人の上に立つ人です。プライドの高さに注意が必要です。"],
["七赤金星","金","社交的で華やか、楽しみ上手です。気分の波と出費に注意が必要です。"],
["八白土星","土","信念が固く、蓄える力があります。変化を乗り越える粘りがありますが、頑固さが出ることもあります。"],
["九紫火星","火","直感とセンスに優れ、情熱的です。感情の起伏が大きくなりがちです。"]];
// 洛書の配置（行ごと）と飛ぶ順番
const GRID=["巽","離","坤","震","中","兌","艮","坎","乾"];
const ORDER=["中","乾","兌","艮","離","坎","坤","震","巽"];
const DIR={巽:"南東",離:"南",坤:"南西",震:"東",中:"中央",兌:"西",艮:"北東",坎:"北",乾:"北西"};
const OPP={坎:"離",離:"坎",坤:"艮",艮:"坤",震:"兌",兌:"震",巽:"乾",乾:"巽"};
const GEN={水:"木",木:"火",火:"土",土:"金",金:"水"}; // 相生
const CTL={木:"土",土:"水",水:"火",火:"金",金:"木"}; // 相剋
const F={
中:["整理と見直しの年",2,"中心に入り、周囲の影響を受けやすい時期です。無理に広げず、足場固めと持ち物・予定の棚卸しに向いています。"],
乾:["責任と飛躍の年",4,"役割や立場が広がります。引き受けた仕事を丁寧に進めれば評価につながります。慢心には注意してください。"],
兌:["実りと楽しみの年",4,"人付き合いや金運に恵まれやすい時期です。楽しい誘いが増えますが、使いすぎには気をつけましょう。"],
艮:["変化と転機の年",3,"転職・引っ越し・人間関係の整理など、変化が起きやすい時期です。前向きに受け止めると次の道が開きます。"],
離:["注目と発信の年",4,"評価や知名度が上がりやすい時期です。目立つ分、言葉づかいや書類の確認を丁寧に。"],
坎:["忍耐と準備の年",2,"停滞を感じやすい時期です。体調管理と基礎固めを優先し、大きな決断は急がないのが無難です。"],
坤:["地道な積み重ねの年",3,"派手さはありませんが、努力が土台になる時期です。コツコツ続けたことが後で実ります。"],
震:["始動と発展の年",5,"新しいことを始めるのに向いた時期です。勢いを大切に、まず小さく動いてみましょう。"],
巽:["信用と広がりの年",4,"縁談・取引・旅など、外とのつながりが広がります。約束と連絡を丁寧にすると信用が育ちます。"]};
const REL={
same:[80,"比和（同じ五行）","価値観や感覚が近く、安心して一緒にいられる関係です。似ているぶん、弱点も重なりやすいので、足りないところは意識して補い合いましょう。"],
give:[85,"あなたが相手を生む（相生）","あなたが相手を支え、伸ばす関係です。相手は居心地よく感じます。尽くしすぎて疲れないよう、頼ることも忘れずに。"],
recv:[90,"相手があなたを生む（相生）","相手の支えでご自身の力が出やすい、伝統的に相性が良いとされる関係です。感謝を言葉にすると長続きします。"],
win:[60,"あなたが相手を剋す（相剋）","あなたがリードしがちで、相手に圧を与えることがあります。意見を聞く時間をつくると安定します。"],
lose:[55,"相手があなたを剋す（相剋）","相手の言動に緊張や刺激を感じやすい関係です。違いを認め、距離感と話し合いのルールを決めると互いの成長になります。"]};

const sum=n=>{n=String(n).split("").reduce((a,c)=>a+ +c,0);return n>9?sum(n):n};
const wrap=n=>{while(n>9)n-=9;while(n<1)n+=9;return n};
const bYear=(y,m,d)=>(m<2||(m===2&&d<4))?y-1:y;
function honmei(str,g){const [y,m,d]=str.split("-").map(Number);const s=sum(bYear(y,m,d));return wrap(g==="m"?11-s:s+4)}
const today=new Date();
const BY=bYear(today.getFullYear(),today.getMonth()+1,today.getDate());
const center=y=>wrap(11-sum(y));
function place(c){const o={};ORDER.forEach((p,k)=>o[p]=wrap(c+k));return o}
function find(pl,star){return Object.keys(pl).find(p=>pl[p]===star)}
function board(pl,me,bad){
  return '<div class="board">'+GRID.map(p=>{const s=pl[p],st=S[s];
    return `<div class="cell${me===s?" me":""}${bad&&bad.includes(p)?" bad":""}"><span class="p">${p}・${DIR[p]}</span><span class="s" data-e="${st[1]}">${st[0].slice(0,2)}</span><span class="e" data-e="${st[1]}">${st[1]}</span></div>`}).join("")+"</div>";
}
const $=id=>document.getElementById(id);
$("hero").innerHTML=board(place(center(BY)),0)+`<p class="cap">${BY}年の年盤（各方位に入る九星）</p>`;

function fortune(){
  const v=$("d1").value,out=$("r1");
  if(!v){out.innerHTML='<p class="err">生年月日を入力してください。</p>';return}
  const n=honmei(v,$("g1").value),st=S[n],pl=place(center(BY)),pos=find(pl,n),f=F[pos];
  const five=find(pl,5),anken=five==="中"?null:OPP[five],honSat=pos==="中"?null:pos,honTeki=pos==="中"?null:OPP[pos];
  const bad=[five,anken,honSat,honTeki].filter(x=>x&&x!=="中");
  const good=Object.keys(pl).filter(p=>p!=="中"&&!bad.includes(p)&&(pl[p]!==5)&&(S[pl[p]][1]===st[1]||GEN[S[pl[p]][1]]===st[1]));
  $("hero").innerHTML=board(pl,n,bad)+`<p class="cap">${BY}年の年盤（点線は凶方位）</p>`;
  out.innerHTML=`<h2>本命星：<span data-e="${st[1]}">${st[0]}</span></h2>
  <p>${st[2]}</p>
  <div class="card"><h3>${BY}年の運勢：${pos}に入る「${f[0]}」 <span class="stars" aria-label="${f[1]}／5">${"★".repeat(f[1])}${"☆".repeat(5-f[1])}</span></h3><p>${f[2]}</p></div>
  <div class="card"><h3>今年の吉方位</h3><p>${good.length?good.map(p=>`<span class="dir">${DIR[p]}</span>`).join(""):"今年は目立った吉方位がありません。"}</p>
  <p style="font-size:14px;color:var(--sub);margin-top:6px">あなたの星を生む、または同じ五行の星が入る方位です。</p></div>
  <div class="card"><h3>避けたい方位</h3><p>${[...new Set(bad)].map(p=>`<span class="dir">${DIR[p]}</span>`).join("")||"なし"}</p>
  <p style="font-size:14px;color:var(--sub);margin-top:6px">五黄殺${anken?"・暗剣殺":""}${honSat?"・本命殺・本命的殺":""}にあたる方位です。</p></div>`;
}
function compat(){
  const a=$("d2").value,b=$("d3").value,out=$("r2");
  if(!a||!b){out.innerHTML='<p class="err">二人の生年月日を入力してください。</p>';return}
  const x=honmei(a,$("g2").value),y=honmei(b,$("g3").value),ex=S[x][1],ey=S[y][1];
  let k=ex===ey?"same":GEN[ex]===ey?"give":GEN[ey]===ex?"recv":CTL[ex]===ey?"win":"lose";
  const r=REL[k];
  out.innerHTML=`<h2><span data-e="${ex}">${S[x][0]}</span> と <span data-e="${ey}">${S[y][0]}</span></h2>
  <div class="card"><div class="score">${r[0]}<span style="font-size:18px"> 点</span></div><h3 style="margin-top:8px">${r[1]}</h3><p>${r[2]}</p></div>
  ${(x===5||y===5)?'<div class="card"><h3>五黄土星を含む組み合わせ</h3><p>五黄土星は個性が強く、相手に大きな影響を与えます。五行の関係だけでなく、お互いの主張を尊重する姿勢が大切です。</p></div>':""}
  <div class="card"><h3>あなた（${S[x][0]}）</h3><p>${S[x][2]}</p></div>
  <div class="card"><h3>お相手（${S[y][0]}）</h3><p>${S[y][2]}</p></div>
  <p style="font-size:14px;color:var(--sub)">五行の相生・相剋にもとづく簡易判定です。点数は目安にとどめてください。</p>`;
}
$("b1").onclick=fortune;$("b2").onclick=compat;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(t=>{const on=t===b;t.setAttribute("aria-selected",on);$(t.getAttribute("aria-controls")).hidden=!on});
});
</script>
</body>
</html>
